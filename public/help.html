<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ActaNews: így működik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#EEF0F3;--panel:#FFFFFF;--ink:#14171F;--muted:#5A6272;--line:#D5DAE2;--accent:#3A3FD8;--accent-soft:#E8E9FB;--on-accent:#FFFFFF;
--f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--f-head:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1218;--panel:#171B24;--ink:#E8EBF2;--muted:#A3AAB8;--line:#2B3140;--accent:#7B83FF;--accent-soft:#232750;--on-accent:#0F1218}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body)}
.wrap{max-width:1040px;margin:0 auto;padding:32px 16px 56px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font:700 clamp(28px,5vw,44px)/1.08 var(--f-head);margin:0;letter-spacing:-.01em}
.lead{font-size:clamp(18px,2.4vw,22px);color:var(--muted);margin:10px 0 0;max-width:620px}
.lead b{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:none;color:var(--ink);font:600 14px var(--f-body);padding:8px 16px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 18px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px}
.pill svg{width:18px;height:18px}
.pill.you{background:var(--accent);color:var(--on-accent)}
.pill.ai{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink)}
.steps{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:14px}
.track{position:absolute;left:24px;top:26px;bottom:26px;width:4px;border-radius:4px;background:var(--line);overflow:hidden}
.track::after{content:"";position:absolute;left:0;right:0;height:18%;top:-18%;border-radius:4px;background:linear-gradient(180deg,transparent,var(--accent) 50%,transparent);animation:run 8s linear infinite}
@keyframes run{to{top:100%}}
.step{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border-radius:16px;padding:16px 18px;border:1.5px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline}
.you .card{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ai .card{border:2px solid var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 8%,transparent)}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;position:relative;z-index:1;margin-top:6px;animation:pulse 8s ease-in-out infinite;animation-delay:var(--d)}
.ico svg{width:28px;height:28px}
@keyframes pulse{0%,8%,100%{transform:scale(1);box-shadow:0 0 0 0 transparent}4%{transform:scale(1.12);box-shadow:0 0 0 8px var(--accent-soft)}}
.you .ico{background:var(--accent);color:var(--on-accent)}
.ai .ico{background:var(--ink);color:var(--panel)}
.who{justify-self:end;align-self:start;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 9px;font:600 13px var(--f-body);white-space:nowrap}
.who svg{width:17px;height:17px}
.you .who{background:var(--accent-soft);color:var(--accent)}.ai .who{background:var(--bg);color:var(--ink)}
.step h2{font:700 21px/1.2 var(--f-head);margin:0}
.step h2 .no{color:var(--muted);font-weight:700;margin-right:6px}
.step p{margin:0;color:var(--muted);grid-column:1 / 3}
.step.hot .card{outline:3px solid var(--accent);outline-offset:3px}
/* loop: click to open */
.loopbtn{grid-column:1 / 3;justify-self:start;margin-top:8px;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px var(--f-body);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.loopbtn svg{width:16px;height:16px;transition:transform .3s}
.loopbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.more{grid-column:1 / 3;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.more.open{grid-template-rows:1fr}
.more > div{overflow:hidden}
.fb{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));padding-top:14px}
.fb div{background:var(--bg);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.fb b{font:700 26px/1 var(--f-head);width:34px;text-align:center;flex:none}
.fb span{font-size:15px}
.back{margin:12px 0 0;font-weight:600;color:var(--accent)!important;display:flex;align-items:center;gap:8px}
.back svg{width:20px;height:20px;flex:none}
@media (max-width:560px){.step{grid-template-columns:40px minmax(0,1fr);gap:10px}.ico{width:40px;height:40px;border-radius:12px}.ico svg{width:22px;height:22px}.track{left:18px}.card{padding:14px}.step h2{font-size:19px}}
@media (prefers-reduced-motion:reduce){.track::after,.ico{animation:none}.more{transition:none}}
.big{margin-top:30px;background:var(--ink);color:var(--panel);border-radius:18px;padding:24px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big .n{font:700 56px/1 var(--f-head);color:var(--accent)}
@media (prefers-color-scheme:dark){.big .n{color:var(--accent)}}
.big p{margin:0;font-size:19px;max-width:640px}
.big small{display:block;margin-top:6px;opacity:.75;font-size:15px}
.hil{margin-top:18px;color:var(--muted);font-size:15px}
.hil b{color:var(--ink)}
@media print{.lang{display:none}body{background:#fff}.step{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-l="hu" aria-pressed="true">HU</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <div class="legend">
    <span class="pill you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-t="lg_you"></span></span>
    <span class="pill ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01"/></svg><span data-t="lg_ai"></span></span>
  </div>
  <ol class="steps" id="steps"></ol>
  <div class="big">
    <span class="n">5×</span>
    <p><span data-t="sum"></span><small data-t="sum_s"></small></p>
  </div>
  <p class="hil" data-t="hil"></p>
</div>
<script>
const I = {
  news: '<path d="M4 5h13v14H6a2 2 0 0 1-2-2Z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/>',
  pick: '<path d="M9 11V5a2 2 0 0 1 4 0v5"/><path d="M13 10a2 2 0 0 1 4 0v1a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-2.5-4a2 2 0 0 1 3.4-2L9 14"/>',
  talk: '<path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>',
  write: '<path d="m12 3 1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  send: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>',
  learn: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'
};
const STEPS = [
  { who: "ai", i: "news", hu: ["Hírek", "Az app összeszedi a friss híreket, ha megnyomod a gombot."], en: ["News", "The app gathers fresh news when you press the button."] },
  { who: "you", i: "pick", hu: ["Választasz", "Kiválasztod, melyik hírre szeretnél reagálni."], en: ["You choose", "You pick which story you want to react to."] },
  { who: "you", i: "talk", hu: ["Elmondod a véleményed", "Egy mondatban leírod, mit gondolsz róla."], en: ["You give your view", "One sentence on what you think about it."] },
  { who: "ai", i: "write", hu: ["A gép megírja", "Elkészül a poszt minden oldalra, a márka stílusában."], en: ["The AI writes it", "A post is drafted for every channel, in the brand's style."] },
  { who: "you", i: "check", hu: ["Átnézed", "Elolvasod és javítod. Amit a gép nem tudhat, például egy dátumot, azt te írod be."], en: ["You check it", "You read and fix it. Anything the AI can't know, like a date, you fill in."] },
  { who: "you", i: "image", hu: ["Kép", "Összerakod a képet, és odébb húzod a szöveget, ha takar."], en: ["Picture", "You build the image and move the text if it covers something."] },
  { who: "you", i: "send", hu: ["Kiteszed", "Te teszed ki a posztot. Az app magától soha nem posztol."], en: ["You post it", "You publish the post. The app never posts on its own."] },
  { who: "ai", i: "learn", hu: ["Tanul tőled", "Abból, amit kedvelsz vagy elutasítasz, megtanulja az ízlésed."], en: ["It learns from you", "From what you like or reject, it learns your taste."] }
];
const T = {
  hu: { title: "Így készül egy poszt", lead: "<b>A gép előkészít, te döntesz.</b> A kék lépéseknél mindig te mondod ki a végső szót.",
    lg_you: "Te döntesz", lg_ai: "A gép dolgozik", you: "Ember", ai: "Gép",
    sum: "Öt ponton te döntesz, és semmi nem kerül ki nélküled.", sum_s: "Ez a lényege a HIL-nek.",
    hil: "<b>HIL</b> (human-in-the-loop) = ember a folyamatban: a gép gyors, de a felelős döntést ember hozza.",
    how: "Hogyan tanul?", fb_star: "Csillag: „ilyet többet”", fb_minus: "Mínusz: „ilyet ne”", fb_tag: "Kizárt hashtag: soha többé", back: "Vissza a 4. lépéshez: legközelebb már így írja meg" },
  en: { title: "How a post is made", lead: "<b>The AI prepares, you decide.</b> At the blue steps you always have the final say.",
    lg_you: "You decide", lg_ai: "The AI works", you: "Human", ai: "AI",
    sum: "You decide at five points, and nothing goes out without you.", sum_s: "That is what HIL means.",
    hil: "<b>HIL</b> (human-in-the-loop): the AI is fast, but a person makes the decisions that matter.",
    how: "How does it learn?", fb_star: "Star: “more like this”", fb_minus: "Minus: “not this”", fb_tag: "Blocked hashtag: never again", back: "Back into step 4: next time it writes this way" }
};
let lang = "hu", open = false;
try { lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("acta-simple-lang") || localStorage.getItem("reax-lang") || "hu"; } catch {}
if (lang !== "en") lang = "hu";
const WHO = { you: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', ai: '<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01"/>' };
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = lang === "hu" ? "ActaNews: így működik" : "ActaNews: how it works";
  document.querySelectorAll("[data-t]").forEach(n => { n.innerHTML = t[n.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  const n = STEPS.length;
  document.getElementById("steps").innerHTML = '<span class="track" aria-hidden="true"></span>' + STEPS.map((s, i) => `
    <li class="step ${s.who}" id="st${i}">
      <span class="ico" style="--d:${(i * 8 / n).toFixed(2)}s">${svg(I[s.i])}</span>
      <div class="card">
      <h2><span class="no">${i + 1}.</span>${s[lang][0]}</h2>
      <span class="who">${svg(WHO[s.who])}${t[s.who]}</span>
      <p>${s[lang][1]}</p>
      ${s.i === "learn" ? `<button type="button" class="loopbtn" aria-expanded="${open}" aria-controls="more">${t.how}${svg('<path d="m6 9 6 6 6-6"/>')}</button>
      <div class="more${open ? " open" : ""}" id="more"><div>
        <div class="fb">
          <div><b>★</b><span>${t.fb_star}</span></div>
          <div><b>−</b><span>${t.fb_minus}</span></div>
          <div><b>#</b><span>${t.fb_tag}</span></div>
        </div>
        <p class="back">${svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>')}${t.back}</p>
      </div></div>` : ""}
      </div>
    </li>`).join("");
  const btn = document.querySelector(".loopbtn");
  btn?.addEventListener("click", () => {
    open = !open;
    btn.setAttribute("aria-expanded", String(open));
    document.getElementById("more").classList.toggle("open", open);
    document.getElementById("st3").classList.toggle("hot", open);
  });
  document.getElementById("st3").classList.toggle("hot", open);
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.l; try { localStorage.setItem("acta-simple-lang", lang); } catch {} render(); }));
render();
</script>
</body>
</html>
